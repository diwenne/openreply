server {
    listen 80;
    listen [::]:80;
    server_name openreply.yoyaku.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openreply.yoyaku.fr;

    access_log /var/log/nginx/openreply.yoyaku.fr.access.log;
    error_log /var/log/nginx/openreply.yoyaku.fr.error.log;

    ssl_certificate /etc/letsencrypt/live/openreply.yoyaku.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openreply.yoyaku.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3048;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
