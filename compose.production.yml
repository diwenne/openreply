name: openreply

services:
  postgres:
    image: postgres:16-alpine
    container_name: openreply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /mnt/data/openreply/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    container_name: openreply-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - /mnt/data/openreply/redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

  migrate:
    image: openreply-worker:${OPENREPLY_IMAGE_TAG:-local}
    build:
      context: .
      target: worker
    env_file:
      - .env
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 512m

  worker:
    image: openreply-worker:${OPENREPLY_IMAGE_TAG:-local}
    build:
      context: .
      target: worker
    container_name: openreply-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    mem_limit: 768m

  web:
    image: openreply-web:${OPENREPLY_IMAGE_TAG:-local}
    build:
      context: .
      target: web
    container_name: openreply-web
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:?AUTH_ALLOWED_EMAILS is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPENREPLY_PORT:-3048}:3000"
    networks:
      - backend
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0755,uid=1001,gid=1001
    pids_limit: 256
    mem_limit: 768m

networks:
  backend:
    name: openreply-backend
    internal: true
    ipam:
      config:
        - subnet: 10.250.48.0/24
  edge:
    name: openreply-edge
    ipam:
      config:
        - subnet: 10.250.49.0/24
