name: Build & Publish (Docker Hub)

# Builda a imagem Docker (Dockerfile na raiz) e publica no Docker Hub.
#
# Secrets necessários no repositório (Settings → Secrets and variables → Actions):
#   * DOCKERHUB_USERNAME  — usuário do Docker Hub (também vira o namespace)
#   * DOCKERHUB_TOKEN     — Access Token do Docker Hub (Account Settings → Security)
#
# Triggers:
#   * push na branch main  -> publica :latest e :sha-xxxx
#   * push de tag vX.Y.Z   -> publica :vX.Y.Z e :latest
#   * disparo manual (workflow_dispatch)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: openreply

jobs:
  build-and-push:
    name: Build & push
    # Opt-in. Without this the job runs on every push to main and fails at the
    # Docker Hub login for anyone who has not set the two secrets — a red X on
    # main forever, which buries real CI failures. Secrets cannot be read from
    # a job-level `if`, so the switch is a repo variable: set DOCKERHUB_ENABLED
    # to "true" under Settings -> Secrets and variables -> Actions -> Variables
    # once DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist.
    if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
